services:
  - type: web
    name: bridge-translation-media-service
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8787
      - key: OPENAI_TRANSLATION_MODEL
        value: gpt-realtime-translate
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: marin
      - key: OPENAI_SAFETY_IDENTIFIER
        value: bridge-phone-call-prototype
      - key: DRY_RUN_CALLS
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TRANSLATION_MEDIA_PUBLIC_WSS_URL
        sync: false
      - key: APP_STREAM_PUBLIC_WSS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: BRIDGE_MEDIA_SHARED_SECRET
        generateValue: true
      - key: BRIDGE_MEDIA_API_KEY
        generateValue: true
